_ > nanoagent.plugin.v0001.ManifestConfig:
id: citibike-nearby
name: NYC Bike Station Finder
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: [gbfs.citibikenyc.com, gbfs.lyft.com]
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  find_nearby_stations:
    description: Find all installed stations renting at least one bike within 100 yards in the supplied snapshot
  get_live_snapshot:
    description: Fetch official Citi Bike feeds once per location per run; return the saved snapshot on subsequent calls

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  find-live-stations:
    description: Fetch Citi Bike availability automatically and find stations within 100 yards of NYC coordinates
    runner: agent
    tools: [get_live_snapshot, find_nearby_stations]
    reference: null
    instructions: |-
      This is the default task for requests about current Citi Bike availability.
      The user supplies only longitude and latitude, never a station snapshot.
      Call get_live_snapshot with the task's exact coordinates to read the official
      feeds captured on the first call. Pass those coordinates and its entire snapshot
      to find_nearby_stations. Submit that tool's complete stations list unchanged.
      You may inspect the captured data, but must not invent or omit stations.
      Results describe the captured feed timestamps, not guaranteed availability
      on arrival. Do not ask the user to obtain the feed. If coordinates are unknown,
      ask for coordinates or confirmation of an approximate location; this plugin
      does not geocode place names. Never claim a guessed location is verified.
  find-nearby-stations:
    description: List every station within 100 yards that is open for rentals and has an available bike
    runner: tool
    tools: [find_nearby_stations]
    reference: null
    instructions: |-
      Use only the supplied fixed snapshot and WGS84 longitude and latitude.
      Join station information and status by station_id. A station is open when
      is_installed and is_renting are both true, and it must have num_bikes_available >= 1.
      Include every station whose Haversine distance is <= 91.44 meters, using an Earth
      radius of 6371008.8 meters without rounding. Return its station_id, name, latitude,
      longitude and num_bikes_available exactly as supplied, sorted lexicographically by ID.
      An empty stations list is valid when there are no matches. Invalid snapshots must fail.
